name: SOC Top 5 Executive Threat Briefing

on:
  schedule:
    # Morning Edition: 8:00 AM ICT (01:00 UTC)
    - cron: '0 1 * * *'
    # Evening Edition: 5:30 PM ICT (10:30 UTC)
    - cron: '30 10 * * *'
  workflow_dispatch:
    inputs:
      edition:
        description: 'Select Briefing Edition'
        required: true
        default: 'morning'
        type: choice
        options:
          - 'morning'
          - 'evening'

permissions:
  contents: read

jobs:
  executive-briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Determine Edition
        id: select_edition
        run: |
          # If manually triggered with input, use that input
          if [ "${{ inputs.edition }}" != "" ]; then
            echo "BRIEFING_MODE=${{ inputs.edition }}" >> $GITHUB_ENV
          else
            HOUR=$(date -u +'%H')
            if [ "$HOUR" -lt "6" ]; then
              echo "BRIEFING_MODE=morning" >> $GITHUB_ENV
            else
              echo "BRIEFING_MODE=evening" >> $GITHUB_ENV
            fi
          fi

      - name: Generate & Deliver Top 5 Briefing
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.6-flash' }}
          BRIEFING_MODE: ${{ env.BRIEFING_MODE }}
        run: |
          python threat_intel_bot.py
