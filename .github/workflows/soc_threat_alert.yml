name: SOC Threat Intelligence Engine

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Execution Mode'
        required: true
        default: 'realtime'
        type: choice
        options:
          - 'realtime'
          - 'morning'
          - 'evening'

permissions:
  contents: write

jobs:
  run-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Detect Mode
        run: |
          MODE="realtime"
          
          # Auto-detect briefing time (Cambodia ICT = UTC+7)
          HOUR_UTC=$(date -u +'%H')
          MIN_UTC=$(date -u +'%M')
          
          # 8:00 AM ICT = 01:00 UTC (match 01:00-01:09)
          if [ "$HOUR_UTC" = "01" ] && [ "$MIN_UTC" -lt "10" ]; then
            MODE="morning"
          fi
          
          # 5:30 PM ICT = 10:30 UTC (match 10:30-10:39)
          if [ "$HOUR_UTC" = "10" ] && [ "$MIN_UTC" -ge "30" ] && [ "$MIN_UTC" -lt "40" ]; then
            MODE="evening"
          fi
          
          # Manual override
          if [ "${{ inputs.mode }}" != "" ] && [ "${{ inputs.mode }}" != "realtime" ]; then
            MODE="${{ inputs.mode }}"
          fi
          
          echo "MODE=$MODE" >> $GITHUB_ENV
          echo "[*] Engine Mode: $MODE (UTC $HOUR_UTC:$MIN_UTC)"

      - name: Run Threat Intel Engine
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.6-flash' }}
          ALERT_DELAY_SECONDS: "15"
          MAX_ALERTS_PER_RUN: "3"
          BRIEFING_MODE: ${{ env.MODE }}
        run: |
          python threat_intel_bot.py

      - name: Save State
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          if [ -f sent_alerts.json ]; then
            git add sent_alerts.json
            if ! git diff-index --quiet HEAD; then
              git commit -m "chore(bot): update sent_alerts state [skip ci]"
              git pull --rebase -X ours origin main || true
              git push origin main || true
            fi
          fi
