name: SOC Threat Intelligence Briefing

on:
  schedule:
    # 08:40 AM ICT (01:40 UTC) everyday
    - cron: '40 1 * * *'
    # 08:40 PM ICT (13:40 UTC) everyday
    - cron: '40 13 * * *'
  workflow_dispatch: # Allows manual 1-click test button

jobs:
  run-threat-briefing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Threat Intel Engine & Send to Telegram
        env:
          TELEGRAM_BOT_TOKEN: '8851782460:AAHjRPVhHzMoWDf3_DFsC-TPQz_UF-qu92s'
          TELEGRAM_CHAT_ID: '-1004385697303'
        run: |
          python threat_intel_bot.py
