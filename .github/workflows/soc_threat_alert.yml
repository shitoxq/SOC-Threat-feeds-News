name: SOC Real-Time Threat Intelligence Monitor

on:
  schedule:
    # Runs automatically every 30 minutes 24/7
    - cron: '*/30 * * * *'
  workflow_dispatch: # Enables manual 1-click execution button

permissions:
  contents: write # Grants permission to commit sent_alerts.json back to repository

# Prevents simultaneous runs from colliding on git commits
concurrency:
  group: threat-intel-monitor
  cancel-in-progress: false

jobs:
  check-and-alert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches full history so git pull/push works cleanly

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Real-Time Threat Intel Scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-1.5-flash' }}
        run: |
          python threat_intel_bot.py

      - name: Save Alert State back to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Pull latest remote changes first to prevent non-fast-forward merge conflicts
          git pull --rebase origin main || true
          
          # Only commit if sent_alerts.json was created or modified
          if [ -f sent_alerts.json ]; then
            git add sent_alerts.json
            if ! git diff-index --quiet HEAD; then
              git commit -m "chore(bot): update sent_alerts state [skip ci]"
              git push
            else
              echo "[*] No state changes detected."
            fi
          fi
