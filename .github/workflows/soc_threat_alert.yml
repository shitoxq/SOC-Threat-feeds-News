name: SOC Real-Time Threat Intelligence Monitor

on:
  schedule:
    # Runs every 10 minutes 24/7
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  realtime-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Real-Time Scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.6-flash' }}
          ALERT_DELAY_SECONDS: "15"
          MAX_ALERTS_PER_RUN: "3"
        run: |
          python threat_intel_bot.py

      - name: Save Alert State back to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          if [ -f sent_alerts.json ]; then
            git add sent_alerts.json
            if ! git diff-index --quiet HEAD; then
              git commit -m "chore(bot): update sent_alerts state [skip ci]"
              git pull --rebase -X ours origin main || true
              git push origin main || true
            else
              echo "[*] No state changes detected."
            fi
          fi
