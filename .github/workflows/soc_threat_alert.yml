name: SOC Real-Time Threat Intelligence Monitor

on:
  schedule:
    # Runs every 30 minutes 24/7 (checks for fresh breaking news)
    - cron: '*/30 * * * *'
  workflow_dispatch: # Allows manual 1-click test button anytime

permissions:
  contents: write # Needed to save sent_alerts.json state to repo

jobs:
  check-and-alert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Real-Time Threat Intel Scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || '8851782460:AAHjRPVhHzMoWDf3_DFsC-TPQz_UF-qu92s' }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '-1004385697303' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python threat_intel_bot.py

      - name: Save Alert History State
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sent_alerts.json
          git diff-index --quiet HEAD || git commit -m "chore: update sent alerts state [skip ci]"
          git push
