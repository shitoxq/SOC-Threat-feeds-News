name: SOC Threat Intelligence Engine

on:
  schedule:
    # Real-time scanning every 10 minutes
    - cron: '*/10 * * * *'
    # Morning Briefing: 8:00 AM ICT = 01:00 UTC
    - cron: '0 1 * * *'
    # Evening Briefing: 5:30 PM ICT = 10:30 UTC
    - cron: '30 10 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Execution Mode'
        required: true
        default: 'realtime'
        type: choice
        options:
          - 'realtime'
          - 'morning'
          - 'evening'

# Prevent duplicate runs at briefing times
concurrency:
  group: soc-engine
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Detect Mode
        run: |
          MODE="realtime"

          # Auto-detect briefing time (Cambodia ICT = UTC+7)
          HOUR_UTC=$(date -u +'%H')
          MIN_UTC=$(date -u +'%M')

          # 8:00 AM ICT = 01:00 UTC (match window 00:55 - 01:14 to handle cron delays)
          if [ "$HOUR_UTC" = "00" ] && [ "$MIN_UTC" -ge "55" ]; then
            MODE="morning"
          elif [ "$HOUR_UTC" = "01" ] && [ "$MIN_UTC" -lt "15" ]; then
            MODE="morning"
          fi

          # 5:30 PM ICT = 10:30 UTC (match window 10:25 - 10:44 to handle cron delays)
          if [ "$HOUR_UTC" = "10" ] && [ "$MIN_UTC" -ge "25" ] && [ "$MIN_UTC" -lt "45" ]; then
            MODE="evening"
          fi

          # Manual override always wins
          if [ "${{ inputs.mode }}" != "" ] && [ "${{ inputs.mode }}" != "realtime" ]; then
            MODE="${{ inputs.mode }}"
          fi

          echo "BRIEFING_MODE=$MODE" >> $GITHUB_ENV
          echo "[*] Engine Mode: $MODE (UTC $HOUR_UTC:$MIN_UTC)"

      - name: Run Threat Intel Engine
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.6-flash' }}
          ALERT_DELAY_SECONDS: "15"
          MAX_ALERTS_PER_RUN: "3"
          BRIEFING_MODE: ${{ env.BRIEFING_MODE }}
        run: |
          python threat_intel_bot.py

      - name: Save State
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ -f sent_alerts.json ]; then
            git add sent_alerts.json
            if ! git diff-index --quiet HEAD; then
              git commit -m "chore(bot): update sent_alerts state [skip ci]"
              git pull --rebase -X ours origin main || true
              git push origin main || true
            fi
          fi
